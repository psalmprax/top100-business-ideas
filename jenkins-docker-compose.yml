services:
  jenkins:
    build:
      context: .
      dockerfile: Jenkins.Dockerfile
    container_name: jenkins
    environment:
      - JAVA_OPTS=-Xmx2048m -Xms512m -Djenkins.install.runSetupWizard=false
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - /home/ubuntu/jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/ubuntu/viralforge:/home/ubuntu/viralforge
    user: "root"
