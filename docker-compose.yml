version: "3.8"

services:
  # Go API Gateway
  api-gateway:
    build:
      context: ./server/go
      dockerfile: Dockerfile
    ports:
      - "7001:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - ENVIRONMENT=development
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - ADMIN_SECRET=${ADMIN_SECRET:?ADMIN_SECRET must be set}
      - JWT_EXPIRY=24h
      - PYTHON_BACKEND_URL=http://python-backend:8000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/alphaai
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=alphaai
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID}
      - PAYPAL_SECRET=${PAYPAL_SECRET}
      - PAYPAL_MODE=${PAYPAL_MODE}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - python-backend
      - db
      - redis
    networks:
      - app-network
      - proxied
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Python AI/ML Backend
  python-backend:
    build:
      context: ./server/python
      dockerfile: Dockerfile
    ports:
      - "7002:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=development
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/alphaai
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=alphaai
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SEED_DATABASE=${SEED_DATABASE:-false}
      - OIDC_GOOGLE_CLIENT_ID=${OIDC_GOOGLE_CLIENT_ID}
      - OIDC_GOOGLE_CLIENT_SECRET=${OIDC_GOOGLE_CLIENT_SECRET}
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY:-test_session_secret_321}
    volumes:
      - ./models:/models
    networks:
      - app-network
      - proxied
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "7000:7000"
    environment:
      - VITE_API_URL=/
      - VITE_WS_URL=/ws
      - VITE_API_PROXY_TARGET=http://api-gateway:8080
      - VITE_STRIPE_PUBLIC_KEY=${VITE_STRIPE_PUBLIC_KEY:-pk_test_placeholder}
    depends_on:
      - api-gateway
    networks:
      - app-network
      - proxied

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=alphaai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "7003:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "7004:6379"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app-network:
    driver: bridge
  proxied:
    name: proxied
    driver: bridge

volumes:
  postgres_data:
