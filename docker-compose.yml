version: '3.8'

services:
  # Go API Gateway
  api-gateway:
    build:
      context: ./server/go
      dockerfile: Dockerfile
    ports:
      - "7001:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - ENVIRONMENT=development
      - JWT_SECRET=your-secret-key-change-in-production
      - JWT_EXPIRY=24h
      - PYTHON_BACKEND_URL=http://python-backend:8000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=alphaai
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - python-backend
      - db
      - redis
    networks:
      - app-network
      - proxied
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Python AI/ML Backend
  python-backend:
    build:
      context: ./server/python
      dockerfile: Dockerfile
    ports:
      - "7002:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=development
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=alphaai
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./models:/models
    networks:
      - app-network
      - proxied
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "7000:3000"
    environment:
      - VITE_API_URL=http://localhost:7001
      - VITE_WS_URL=ws://localhost:7001
      - VITE_STRIPE_PUBLIC_KEY=${VITE_STRIPE_PUBLIC_KEY:-pk_test_placeholder}
    depends_on:
      - api-gateway
    networks:
      - app-network
      - proxied

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=alphaai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "7003:5432"
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "7004:6379"
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx Proxy Manager (NPM) - Reverse Proxy with GUI
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    ports:
      - "80:80" # HTTP
      - "443:443" # HTTPS
      - "81:81" # Admin UI
    volumes:
      - ./npm/data:/data
      - ./npm/letsencrypt:/etc/letsencrypt
    networks:
      - proxied
    depends_on:
      - npm-db

  # NPM Database (MariaDB)
  npm-db:
    image: mariadb:latest
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: npm_root_password
      MYSQL_DATABASE: npm
      MYSQL_USER: npm
      MYSQL_PASSWORD: npm_password
    volumes:
      - ./npm/mysql:/var/lib/mysql
    networks:
      - proxied

networks:
  app-network:
    driver: bridge
  proxied:
    name: proxied
    driver: bridge

volumes:
  postgres_data:
